<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>雨雨欣的专属手机 · 高仿微信</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="iphone">
<input type="file" id="file" accept="image/*" style="display:none">
<input type="file" id="galleryFile" accept="image/*" multiple style="display:none">
<!-- 主屏幕（首页） -->
<div id="home" class="screen active">
  <div class="top-area">
    <div class="avatar" id="avatar"></div>
    <div class="bg-strip" id="clock">00:00</div>
  </div>
  <div class="mixed-layout">
    <div class="layout-col">
      <div class="apps-2x2">
        <div class="app-icon-small" onclick="openApp('chat-screen')">
          <div class="icon-box-small" style="background:#07c160;color:#fff"></div>
          <span class="icon-label-small">微信</span>
        </div>
        <div class="app-icon-small" onclick="openApp('gallery-screen')">
          <div class="icon-box-small" style="background:#ffcc00;color:#fff">️</div>
          <span class="icon-label-small">相册</span>
        </div>
        <div class="app-icon-small"><div class="icon-box-small" style="color:#ff3b30"></div><span class="icon-label-small">日历</span></div>
        <div class="app-icon-small"><div class="icon-box-small" style="color:#4cd964">⛅</div><span class="icon-label-small">天气</span></div>
      </div>
      <div class="widget-wrapper">
        <div class="widget-box" id="widget-music"><div style="width:100%;height:100%;background:#333;display:flex;justify-content:center;align-items:center;color:#fff;font-size:40px"></div></div>
        <span class="widget-label">网易云音乐</span>
      </div>
    </div>
    <div class="layout-col">
      <div class="widget-wrapper" onclick="openFirstPhoto()">
        <div class="widget-box" id="widget-gallery"><div style="width:100%;height:100%;background:#fecfef;display:flex;justify-content:center;align-items:center;color:#fff;font-size:40px">️</div></div>
        <span class="widget-label">相册精选</span>
      </div>
      <div class="apps-2x2">
        <div class="app-icon-small" onclick="openApp('beautify-screen')"><div class="icon-box-small" style="background:linear-gradient(135deg,#ff69b4,#ff1493);color:#fff">✨</div><span class="icon-label-small">美化</span></div>
        <div class="app-icon-small"><div class="icon-box-small" style="background:linear-gradient(135deg,#ffd700,#ffb90f);color:#fff"></div><span class="icon-label-small">纪念日</span></div>
        <div class="app-icon-small"><div class="icon-box-small" style="background:linear-gradient(135deg,#4cd964,#34c759);color:#fff"></div><span class="icon-label-small">钱包</span></div>
        <div class="app-icon-small" onclick="openApp('settings-screen')"><div class="icon-box-small" style="background:linear-gradient(135deg,#8e8e93,#d1d1d6);color:#fff">⚙️</div><span class="icon-label-small">设置</span></div>
      </div>
    </div>
  </div>
  <div class="dock">
    <div class="dock-icon" style="background:#34c759;color:#fff"></div>
    <div class="dock-icon" style="background:#007aff;color:#fff"></div>
    <div class="dock-icon" style="background:#ff9500;color:#fff"></div>
  </div>
</div>
<!-- 相册屏幕 -->
<div id="gallery-screen" class="screen hidden">
  <div class="app-header"><div class="back-btn" onclick="goHome()">返回</div><div class="app-title">宝宝的相册</div></div>
  <div class="gallery-toolbar"><button class="btn-blue" onclick="toggleSelect()">多选</button><div><button class="btn-red" onclick="delSelect()" style="display:none">删除</button><button class="btn-green" onclick="shareSelect()" style="display:none">分享</button></div></div>
  <div style="padding:15px;text-align:center"><button style="border:none;background:#007aff;color:#fff;padding:12px 24px;border-radius:20px;font-weight:700" onclick="galleryFile.click()">+ 添加照片</button></div>
  <div class="photo-grid" id="photoGrid"></div>
</div>
<!-- 照片详情 -->
<div id="photo-detail" class="hidden">
  <div class="photo-detail">
    <div class="detail-head"><div class="detail-back" onclick="closeDetail()">← 返回</div><div class="detail-select" onclick="toggleSelect()">选择</div></div>
    <div class="detail-time" id="showTime"></div>
    <div class="detail-img"><img id="showImg"></div>
    <div class="detail-bar">
      <div class="detail-btn" onclick="shareDetail()">分享</div>
      <div class="detail-btn" onclick="removeDetail()">↩️移出</div>
      <div class="detail-btn" onclick="delDetail()">删除</div>
      <div class="detail-btn" onclick="setWallpaper()">️壁纸</div>
    </div>
  </div>
</div>
<!-- 美化屏幕 -->
<div id="beautify-screen" class="screen hidden">
  <div class="app-header"><div class="back-btn" onclick="goHome()">返回</div><div class="app-title">美化中心</div></div>
  <div class="content">
    <button class="btn" onclick="setTarget('wallpaper')">更换壁纸</button>
    <button class="btn" onclick="setTarget('avatar')">更换头像</button>
    <button class="btn" onclick="setTarget('clock')">更换时间条</button>
    <button class="btn" onclick="setTarget('widget-music')">更换网易云音乐</button>
    <button class="btn" onclick="setTarget('widget-gallery')">更换相册精选</button>
  </div>
</div>
<!-- 设置屏幕 -->
<div id="settings-screen" class="screen hidden">
  <div class="app-header"><div class="back-btn" onclick="goHome()">返回</div><div class="app-title">设置</div></div>
  <div class="content">
    <input id="apiUrl" placeholder="API URL" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box">
    <input id="apiKey" placeholder="API Key" type="password" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box">
    <input id="apiModel" list="modelList" placeholder="模型名称" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box">
    <datalist id="modelList"></datalist>
    <button class="btn" onclick="pullModel()">拉取模型</button>
    <button class="btn" onclick="saveConfig()">保存配置</button>
  </div>
</div>
<!-- 微信屏幕（登录页 + 主界面） -->
<div id="chat-screen" class="screen hidden">
  <!-- 登录页 -->
  <div id="wx-login-page" class="wx-login">
    <h2>微信登录</h2>
    <input id="login-account" placeholder="账号" value="">
    <input id="login-pwd" type="password" placeholder="密码" value="">
    <button onclick="login()">登录</button>
    <div style="margin-top:20px;color:#888;">输入任意账号密码，新账号自动创建</div>
  </div>
  <!-- 微信主界面（登录后显示） -->
  <div id="wx-main" class="hidden" style="height:100%; position:relative;">
    <div class="app-header">
      <div class="back-btn" onclick="goHome()">返回</div>
      <div class="app-title">微信</div>
      <button class="wx-add" onclick="showAddFriend()">+添加好友</button>
    </div>
    <!-- 微信列表页（聊天） -->
    <div id="wx-page-list" class="wx-list"><div id="wx-chat-list" style="padding-bottom:10px;"></div></div>
    <!-- 通讯录页 -->
    <div id="wx-page-contact" class="wx-list hidden">
      <div style="padding:10px;">
        <div style="background:#fff;border-radius:10px;">
          <div class="wx-item" onclick="showRequests()"><div style="font-weight:700;">新的朋友</div><span id="request-badge" style="background:red;color:#fff;border-radius:10px;padding:2px 6px;margin-left:10px;display:none;"></span></div>
          <div class="wx-item" onclick="showContactList()"><div style="font-weight:700;">通讯录</div></div>
        </div>
      </div>
    </div>
    <!-- 我页面 -->
    <div id="wx-page-me" class="wx-list hidden">
      <div style="padding:20px;text-align:center;">
        <div class="avatar" id="me-avatar" style="margin:0 auto;"></div>
        <h3 id="me-name"></h3>
        <p id="me-account"></p>
        <button class="btn" onclick="logout()" style="width:80%;">切换账号</button>
      </div>
    </div>
    <!-- 底部导航 -->
    <div class="wx-tab">
      <div class="wx-tab-item active" onclick="wxTab('list', event)">微信</div>
      <div class="wx-tab-item" onclick="wxTab('contact', event)">通讯录</div>
      <div class="wx-tab-item" onclick="wxTab('me', event)">我</div>
    </div>
    <!-- 聊天页面（隐藏，进入聊天时显示） -->
    <div id="wx-page-chat" class="hidden">
      <div class="my-avatars" id="myAvatars"></div>
      <div id="chatBox"></div>
      <div style="padding:15px 20px 25px; display:flex; gap:10px; background:#f9f9f9; border-top:1px solid #eee">
        <input style="flex:1; padding:12px 15px; border:1px solid #ddd; border-radius:20px; outline:none" id="msgInput" placeholder="发消息..." onkeypress="if(event.key=='Enter')send()">
        <button style="padding:0 20px; background:#07c160; color:#fff; border:none; border-radius:20px; font-weight:700" onclick="send()">发送</button>
      </div>
    </div>
    <!-- 添加好友浮层 -->
    <div id="wx-add-friend" class="floating-layer hidden">
      <div class="app-header"><div class="back-btn" onclick="hideAddFriend()">返回</div><div class="app-title">添加好友</div></div>
      <div style="padding:20px;">
        <input id="search-account" placeholder="输入对方账号" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;">
        <button class="btn" onclick="searchFriend()">搜索</button>
        <div id="search-result" style="margin-top:20px;"></div>
      </div>
    </div>
    <!-- 新的朋友浮层 -->
    <div id="wx-requests-page" class="floating-layer hidden">
      <div class="app-header"><div class="back-btn" onclick="hideRequests()">返回</div><div class="app-title">新的朋友</div></div>
      <div id="requests-list" style="padding:10px;"></div>
    </div>
    <!-- 通讯录好友列表浮层 -->
    <div id="wx-contact-list" class="floating-layer hidden">
      <div class="app-header"><div class="back-btn" onclick="hideContactList()">返回</div><div class="app-title">通讯录</div></div>
      <div id="contact-list" style="padding:10px;"></div>
    </div>
  </div>
</div>
<!-- 心语弹窗 -->
<div class="heart-popup heart-hide" id="heartPopup"><div id="heartText"></div><button onclick="closeHeart()" style="margin-top:10px;width:100%;padding:8px;background:#ff9a9e;color:#fff;border:none;border-radius:8px">关闭</button></div>
</div>
<script src="script.js"></script>
</body>
</html>
